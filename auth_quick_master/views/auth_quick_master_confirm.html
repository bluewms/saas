<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>{{ message }}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; padding: 0 1.5rem; max-width: 34rem; color: #25313c; }
        button { padding: .8rem 1.2rem; border: 0; border-radius: .4rem; background: #714b67; color: white; font: inherit; cursor: pointer; }
    </style>
</head>
<body>
    <h1>{{ message }}</h1>
    <form action="{{ action_url }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        {% for key, value in params.items() %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}
        <button type="submit">{{ message }}</button>
    </form>
</body>
</html>
